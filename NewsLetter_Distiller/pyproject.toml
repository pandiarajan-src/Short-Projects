[project]
name = "newsletter-distiller"
version = "0.1.0"
description = "Turn a newsletter URL into a clean Markdown digest using a pluggable LLM backend."
readme = "README.md"
authors = [
    { name = "Pandiarajan", email = "pandi.rajan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
newsletter-distiller = "newsletter_distiller:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "responses>=0.26.3",
]
